services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: parcelpilot
      POSTGRES_PASSWORD: parcelpilot
      POSTGRES_DB: parcelpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelpilot -d parcelpilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Explicit `environment:` beats `env_file:` for the same key. .env sets
      # DATA_DIR=./data for host-side scripts; inside the container the data
      # pack is mounted at /data, so this pin is required, not redundant.
      DATABASE_URL: postgresql://parcelpilot:parcelpilot@db:5432/parcelpilot
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # `docker compose run --rm setup` -> migrate + ingest in one shot.
  # Not started by `up`; it is a one-off task, not a service.
  setup:
    build:
      context: ./backend
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://parcelpilot:parcelpilot@db:5432/parcelpilot
      DATA_DIR: /data
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    command: python -m scripts.setup

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "5173:4173"

volumes:
  pgdata:
