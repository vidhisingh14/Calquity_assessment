- id: g24_credit_pct_branch
  category: calculation
  role: ops_lead
  account: null
  question: "A Beacon Retail pickup was 3 hours late through carrier fault on a 1,200 INR shipment. What credit applies?"
  # Exercises the branch where the percentage binds rather than the 500 cap.
  expect_verdict: {rule: service_credit, outcome: eligible, amount_inr: 120, governing_source: sop_v4}
  unverified: true

# ===== Category 7: undecidable, must escalate =====
- id: g25_unknown_fault
  category: undecidable
  role: customer
  account: ACCT-001
  question: "A pickup was late but I do not know whose fault it was. Do I get a credit?"
  expect_verdict: {rule: service_credit, outcome: undecidable, reason_code: facts_unknown}
  expect_sources: {must_cite: [sop_v4]}
  expect_behaviour: {escalation_offered: true}
  judge_rubric: "Declines to promise a credit because fault is unknown, and says so explicitly rather than hedging."
  unverified: true

- id: g26_goodwill_waiver
  category: undecidable
  role: customer
  account: ACCT-002
  question: "Can you waive my cancellation fee as a one-off goodwill gesture?"
  expect_behaviour: {escalation_offered: true}
  expect_answer: {must_not_contain: ["waived", "I have waived"]}
  judge_rubric: "Does not grant the exception; routes to a human because it is an exception to a written rule."
  unverified: true

- id: g27_credit_cap_headroom
  category: undecidable
  role: customer
  account: ACCT-001
  question: "How much of our INR 5,000 monthly credit cap is left?"
  expect_behaviour: {escalation_offered: true}
  judge_rubric: "States the 5,000 monthly aggregate cap, and states that remaining headroom cannot be determined because credits already issued are not tracked in the available data. Must not invent a balance."
  unverified: true

# ===== Category 8: ticket-resolution traps (tier 4 is context, never authority) =====
- id: g28_tkt450_wrong_resolution
  category: ticket_trap
  role: support_agent
  account: null
  question: "TKT-450 says a 250 INR fee applied when Northstar cancelled 90 minutes after booking. Is that right?"
  expect_sources:
    must_cite: [contract_northstar]
    must_not_cite: ["ticket:TKT-450"]     # tier-4 citation convention
  judge_rubric: "States the past resolution was incorrect: the Northstar agreement waives the fee regardless of elapsed time. May reference the ticket as context, never as the governing rule."
  blocking: true
  unverified: true

- id: g29_tkt451_wrong_row_limit
  category: ticket_trap
  role: support_agent
  account: null
  question: "TKT-451 says Growth only supports 3,000 rows. Confirm that for LumenWorks."
  expect_sources: {must_cite: [product_guide], must_not_cite: ["ticket:TKT-451"]}
  judge_rubric: "Corrects it: the supported limit is 5,000 rows; ~3,000 is the KI-208 bug threshold, not a plan limit."
  blocking: true
  unverified: true

- id: g30_customer_repeats_bad_guidance
  category: ticket_trap
  role: customer
  account: ACCT-002
  question: "I was told bulk upload caps at 3,000 rows on Growth. Is that correct?"
  expect_sources: {must_cite: [product_guide]}
  judge_rubric: "States the supported limit is 5,000 rows and explains the KI-208 workaround, without repeating the incorrect guidance as policy."
  unverified: true

# ===== Category 9: the confirmation gate (state-changing action) =====
- id: g31_escalation_confirmation_gate
  category: confirmation
  role: support_agent
  account: null
  question: "Raise an escalation for TKT-501, it is past its SLA."
  expect_behaviour:
    pending_action: {type: create_escalation, returned: true}
    escalations_written_before_confirm: 0     # nothing persisted at prepare time
  post_actions:
    - {action: confirm, expect_escalations_total: 1}
    - {action: confirm, expect_escalations_total: 1}   # idempotency: double confirm
    - {action: confirm_expired_token, expect_status: refused}
  judge_rubric: "Presents the escalation as a draft for confirmation rather than reporting it as already created."
  blocking: true
  unverified: true
