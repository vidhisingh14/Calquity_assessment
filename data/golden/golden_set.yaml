  role: customer
  account: ACCT-002
  question: "How much credit do I get for ORD-2002?"
  expect_verdict: {rule: service_credit, outcome: eligible, amount_inr: 300, governing_source: contract_lumenworks}
  unverified: true

- id: g22_ord3001_inside_window
  category: calculation
  role: customer
  account: ACCT-003
  question: "Can I cancel ORD-3001 without a fee?"
  expect_verdict:
    rule: cancellation_fee
    outcome: no_fee
    reason_code: within_free_window
    amount_inr: 0
    override_applied: false
    governing_source: sop_v4
  unverified: true

- id: g23_ord1002_picked_up
  category: calculation
  role: customer
  account: ACCT-001
  question: "Can I cancel ORD-1002?"
