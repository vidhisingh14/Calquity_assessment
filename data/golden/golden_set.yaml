# ParcelPilot — golden evaluation set
#
# Reference time for every expectation: 2026-08-16T11:00:00+05:30 (README snapshot).
#
# unverified: true -> question AND expected answer were drafted by the coding
#   agent from a single reading of the pack. Until a human signs a row off, it
#   measures self-consistency, not correctness. run_eval.py reports verified and
#   unverified scores as SEPARATE figures for exactly this reason.
#
# blocked_on: <assumption id> -> the expected verdict depends on an unresolved
#   ambiguity recorded in docs/superpowers/specs/2026-08-23-parcelpilot-agent-design.md §0.
#
# Full provenance and working: docs/review/golden-set-review.md

version: 1
prompt_version: null          # stamped by run_eval.py at execution time
snapshot_reference: "2026-08-16T11:00:00+05:30"

questions:

# ===== Category 1: straightforward policy (tier 2/3) =====
- id: g01_standard_p3_target
  category: policy_basic
  role: customer
  account: ACCT-003
  question: "How quickly will you respond to a general how-to question?"
  expect: {verdict_contains: ["2 business days"], must_cite: [policy_v3], must_not_cite: [policy_v2], escalated: false}
  unverified: true

- id: g02_enterprise_p1_target
  category: policy_basic
  role: customer
  account: ACCT-004
  question: "How fast do you respond to a complete outage?"
  expect: {verdict_contains: ["30 minutes"], must_cite: [policy_v3], must_not_cite: [policy_v2], escalated: false}
  unverified: true

- id: g03_delivered_cannot_cancel
  category: policy_basic
  role: customer
  account: ACCT-003
  question: "Can I cancel an order that has already been delivered?"
  expect: {verdict_contains: ["cannot"], must_cite: [sop_v4], escalated: false}
  unverified: true

- id: g04_bulk_upload_limit
  category: policy_basic
  role: customer
  account: ACCT-002
  question: "Is bulk upload available on my plan, and what is the row limit?"
  expect: {verdict_contains: ["5,000"], must_cite: [product_guide], answer_must_contain: ["KI-208"], escalated: false}
  unverified: true

# ===== Category 2: contract override (tier 1 must win, and be stated) =====
- id: g05_northstar_cancel_fee
  category: contract_override
  role: customer
  account: ACCT-001
  question: "Can Northstar cancel ORD-1001 without a cancellation fee, and why?"
  expect:
    verdict_contains: ["no", "fee"]
    must_cite: [contract_northstar]
    must_not_cite: [policy_v2]
    override_applied: true
    escalated: false
  unverified: true
  blocked_on: [A1, A2]

- id: g06_northstar_p1_override
  category: contract_override
  role: customer
  account: ACCT-001
  question: "What is your first-response target for a P1?"
  expect: {verdict_contains: ["15 minutes"], must_cite: [contract_northstar], override_applied: true, escalated: false}
  unverified: true

- id: g07_lumenworks_3h_no_credit
  category: contract_override
  role: customer
  account: ACCT-002
  question: "A pickup was 3 hours late and the carrier was at fault. Do I get a service credit?"
  expect:
    verdict_contains: ["not eligible"]
    must_cite: [contract_lumenworks]
    override_applied: true
    answer_must_not_contain: ["INR 300"]
    escalated: false
  unverified: true

- id: g08_northstar_3h_credit_defers_to_sop
  category: contract_override
  role: customer
  account: ACCT-001
  question: "If a pickup were 3 hours late through carrier fault on a shipment with a 4,200 INR fee, what credit applies?"
  expect: {verdict_contains: ["420"], must_cite: [sop_v4, contract_northstar], escalated: false}
  unverified: true

- id: g09_lumenworks_cancel_fee_applies
  category: contract_override
  role: customer
  account: ACCT-002
  question: "Can I cancel ORD-2001 without a fee?"
  expect: {verdict_contains: ["250"], must_cite: [sop_v4, contract_lumenworks], override_applied: false, escalated: false}
  unverified: true
  blocked_on: [A1]

